constraints:
  nodejs-cli-runtime:
    description: The implementation is a Node.js command line application.
  subcommand-cli-shape: The CLI exposes behavior through named subcommands.
  explicit-exit-code-semantics: The CLI exposes reliable exit-code semantics suitable for scripts and tests.
  npm-distribution: The project can be packaged or installed through npm-compatible tooling.
  filesystem-state: The implementation persists state through files, not an
    external database, unless the Seed says otherwise.
  unit-test-coverage: Seed-critical pure or isolated behavior should have unit
    test coverage when practical.
  integration-test-coverage: Seed-critical multi-component workflows should have
    integration test coverage when practical.
  readme-command-accuracy:
    description: Commands shown in the README are current, executable from their
      documented context, and checked against the repository.
    policy: global
  minimal-dependency-surface: Avoid unnecessary runtime dependencies when standard
    library or existing project dependencies are sufficient.
  explicit-license-choice:
    description: The repository owner selected the MIT terms recorded in
      @repo-license; implementation work must not infer or replace that license.
    artifacts:
      - repo-license
    policy: global
  license-metadata-consistency:
    description: The root package.json and root package entry in package-lock.json
      declare MIT, matching the authoritative MIT terms in @repo-license. README
      and source files are not license-declaration surfaces in the as-built
      product.
    artifacts:
      - repo-license
      - package-manifest
      - dependency-lock
    policy: global
  selected-seed-authority:
    description: Only this master Seed's explicit and implicit addresses plus global
      policies create verification ownership; referenced or future Seeds remain
      separate.
    policy: global
  deterministic-data:
    description: Canonical JSON recursively sorts object keys, preserves array
      order, and deterministic collections retain complete output including data
      larger than a typical pipe buffer.
  verification-state-integrity:
    description: Session state updates are lock-serialized, terminal evidence is
      hash-bound, refresh is all-or-nothing, injected attestations are
      authorization- and revision-bound and visibly distinct from executed
      proof, reopen preserves displaced terminal evidence as history before
      focused reverification, and failures never fabricate successful evidence.
    policy: global
  one-cli-package:
    description: The product remains one npm-compatible package with one seed
      executable; internal modules may remain focused implementation units.
  dependency-snapshot-ownership:
    description: Cross-Seed dependency snapshots report dependency drift but never
      promote source-Seed obligations into master implementation or verification
      work.
    policy: global
  private-prototype:
    description: The source repository and contract files are publicly distributed
      under MIT, while the npm package remains marked private against registry
      publication. Registry release obligations require a later Seed change.
environment:
  npm-install:
    description: Dependencies are installed with npm from package.json and
      package-lock.json when present.
  npm-package: Package metadata and install behavior are defined through package.json.
  node-and-npm:
    description: The product runs as a CommonJS Node.js CLI with npm-managed
      dependencies. The package declares no Node.js engines range, so master
      does not invent a minimum runtime version.
    artifacts:
      - package-manifest
      - dependency-lock
  package-status:
    description: Version 0.0.0 is an unpublished npm prototype in a public MIT
      source repository. Local installation and packing are supported; npm
      registry publication is not an active product surface.
    artifacts:
      - package-manifest
freedom:
  nodejs-cli-structure:
    description: Implementation may choose any maintainable internal Node.js module
      structure.
  internal-modules:
    description: Production may choose maintainable CommonJS module boundaries and
      algorithms while preserving the observable command, data, state, and error
      contracts.
  performance-strategy:
    description: Compilation, diffing, locking, hashing, and command replay
      strategies may change when deterministic results, bounded diagnostics, and
      state integrity remain intact.
  future-surfaces:
    description: New runtimes, publication, commands, formats, or stronger security
      policies require explicit contract changes rather than inference from this
      freedom.
metadata:
  name: seed-lang
  summary: Public-source Node.js CLI and contract language for authoring,
    composing, inspecting, diffing, and verifying Seed software contracts.
  description: Defines the as-built Seed document model, reusable genome compiler,
    constructed blueprint and diff views, executable verification ledger, and
    unpublished npm package and portable-skill distribution surfaces.
interfaces:
  cli:
    purpose: User invokes named subcommands through the CLI.
    examples:
      - <command> <subcommand> --help
      - <command> <subcommand> [options]
    executable:
      description: The package exposes one seed executable backed by src/cli.js. It
        accepts a leading --repo path, one optional --seed name, global --help
        or -h, and named command families.
      examples:
        - seed --help
        - seed --repo PATH validate
        - seed --seed NAME blueprint --json
      artifacts:
        - package-manifest
        - source-contract
    project-commands:
      description: init, list, validate, diff, and blueprint operate on the selected
        Seed; blueprint exposes human-readable or JSON contract data and
        semantic selection, while diff compares against the selected
        verification snapshot.
      examples:
        - seed init --genome cli-nodejs
        - seed list
        - seed validate
        - seed diff
        - seed blueprint --json --filter @behavior.genomes.resolution
    genome-commands:
      description: genome list, search, init, validate, and blueprint expose built-in,
        user, and repository genome discovery and inspection. Search reports
        matching genome IDs, origins, tags, match types, and direct genome
        addresses.
      examples:
        - seed genome list --builtin
        - seed genome search docker
        - seed genome search graceful shutdown --full-text
        - seed genome validate --builtin
        - seed genome blueprint cli-nodejs --json
      artifacts:
        - genome-catalog
    verification-commands:
      description: verify start, reset, pending, next, claim, reopen, confirm, fail,
        check, inject, refresh-expired, audit, report, status, sync expose the
        verification state machine. Confirm and fail require an owner, evidence
        files, and executable test commands. Inject requires an owner, evidence
        files, the exact --authorization operator-requested-sdd-injection
        acknowledgement, explicit per-command pass or fail attestations, and
        evidence or reason text. Reopen requires an owner and reason, preserves
        prior terminal evidence as history, and either names exact items or
        previews an evidence-file selection before explicit --apply.
      examples:
        - seed verify start
        - seed verify next --owner agent
        - seed verify reopen ITEM --owner agent --reason TEXT
        - seed verify reopen --evidence-file PATH --owner agent --reason TEXT
          --apply
        - seed verify confirm ITEM --owner agent --file PATH --test-cmd COMMAND
        - seed verify inject ITEM --owner agent --authorization
          operator-requested-sdd-injection --file PATH --pass-cmd COMMAND
          --evidence TEXT
        - seed verify status
    skill-installation:
      description: install-skill requires exactly one of --codex or --claude and
        installs the packaged Seed skill into the selected platform's configured
        user skill root.
      examples:
        - seed install-skill --codex
        - seed install-skill --claude
      artifacts:
        - portable-skill
  files:
    artifacts:
      - genome-catalog
    examples:
      - seed/seed.yml
      - .seed/seed.snapshot.yml
    authored-contracts:
      description: Master uses seed/seed.yml and seed/scripts; named Seeds use
        seed/NAME/seed.yml and seed/NAME/scripts.
      examples:
        - seed/seed.yml
        - seed/release/seed.yml
    generated-verification-state:
      description: Master state is under .seed and named state under .seed/NAME,
        including snapshots, dependency snapshots, sessions, and transient
        locks.
      examples:
        - .seed/seed.snapshot.yml
        - .seed/release/sessions/default.json
    genome-origins:
      description: Built-ins come from @genome-catalog, user overrides from
        ~/.seed/genomes, and repository overrides from seed/genomes.
      artifacts:
        - genome-catalog
      examples:
        - resources/genomes/cli-nodejs.yml
        - seed/genomes/project-policy.yml
  package:
    artifacts:
      - package-manifest
      - dependency-lock
    examples:
      - npm pack --dry-run --json
    npm-compatible:
      description: "@package-manifest and @dependency-lock define a locally
        installable and packable npm package that is marked private against
        registry publication and contains src, resources, README, package
        metadata, and the MIT license."
      artifacts:
        - package-manifest
        - dependency-lock
      examples:
        - npm install -g .
        - seed --help
behavior:
  subcommand-dispatch: The first positional command token selects a subcommand or
    produces a clear unknown-subcommand error.
  readme-content:
    description: The root README states product purpose and prototype status,
      prerequisites, repository and skill installation, quick-start usage, Seed
      structure, genomes, blueprints and diffs, standalone verification
      workflow, command summary, repository layout, development checks, and
      current boundaries.
    artifacts:
      - repo-readme
  contract-language:
    document-model:
      description: A Seed is YAML with required metadata and nonempty scope,
        interfaces, behavior, constraints, freedom, and verifications sections;
        errors may be empty. Optional addressable sections are artifacts, state,
        security, environment, observability, and compatibility.
    metadata-tags:
      description: Seed and genome metadata may include an optional tags field
        containing a simple list of nonempty strings. Tags preserve authored
        spelling and order and do not create contract addresses.
    address-normalization:
      description: Addressable trees and ID-bearing lists compile into unique dotted
        addresses. IDs start alphanumeric and contain only letters, numbers,
        underscores, and hyphens. Known item properties remain fields rather
        than child addresses.
    requirements-readiness:
      description: requirements is a temporary planning inbox. Blueprint and diff
        expose unresolved entries, but validation and verification start fail
        until it is absent or empty and the entries have been converted into the
        contract.
    artifacts-and-references:
      description: Artifacts use repository-relative paths or HTTP(S) URLs and require
        descriptions. Items that mention local artifacts declare their IDs.
        Local, cross-Seed, and genome-qualified references must resolve or fail.
    policies:
      description: Ordinary items default to local policy, security items default
        global, and explicit global policy items are supplied as context for
        every verification claim and checked by audit.
  repository-selection:
    default-and-named-seeds:
      description: The default Seed is master. Named Seeds use safe non-master names
        and isolated authored and generated paths. Listing reports master first
        and then safe named Seeds in lexical order.
    initialization:
      description: init validates requested genomes before writes, creates only the
        selected contract and scripts directory, refuses replacement unless
        --overwrite, and idempotently ignores only .seed/locks in a seed-lang
        gitignore block.
  genomes:
    artifacts:
      - genome-catalog
      - github-license-template-catalog
    resolution:
      description: Genome lookup precedence is built-in, user, then repository.
        Requested genomes compose in order and local Seed values merge last. The
        winning address retains origin, ID, and path provenance.
      artifacts:
        - genome-catalog
    composition:
      description: Recursive composition detects cycles and excessive depth. Keyed
        objects merge recursively, ID arrays merge by ID, addressable tree/list
        forms normalize together, ordinary arrays replace, and scalars replace.
    selectors:
      description: String and object selectors include sections, addresses, subtrees,
        or artifacts with reference and artifact closure. Exclusions remove
        exact, subtree, ID, artifact, or glob matches after composition. Any
        unmatched selector fails.
    complete-exclusion:
      description: Standalone !genome exclusions are order-independent, remove the
        genome transitively throughout the composed graph, and fail when
        unmatched.
    search:
      description: Genome search uses case-insensitive substring matching across
        definition IDs, metadata names, summaries or descriptions, tags, and
        direct authored address names. --full-text additionally searches values
        within each direct address. Built-in, user, and repository origin
        filters apply; deterministic results report each genome's ID, origin,
        tags, match types, and matching addresses without treating inherited
        addresses as direct matches.
    runtime-verification-cleanup:
      description: Built-in deployment genomes that verify configurable runtime
        identities require unique disposable workspaces beneath /tmp for all
        mutable test data and bind-mount sources, reliable cleanup on success
        and failure, and post-cleanup proof that test containers, volumes,
        networks, directories, and files with test-selected ownership were not
        left behind.
      artifacts:
        - genome-catalog
    repository-license-selection:
      description: The built-in repo-license-* selection genomes cover every standard
        template in @github-license-template-catalog. Each composes
        repo-license, selects one GitHub license key and reported SPDX
        identifier through shared contract addresses, requires matching LICENSE
        and repository metadata, and leaves the owner responsible for the legal
        choice.
      artifacts:
        - genome-catalog
        - github-license-template-catalog
  blueprints-and-diffs:
    constructed-blueprint:
      description: Blueprint compiles local and genome content into fixed semantic
        section order with exact addresses, values, references, provenance,
        applied genomes, filters, requirements readiness, and external
        dependencies.
    machine-data:
      description: JSON blueprint output contains the complete constructed data model.
        Section, address or ID filters retain reference closure; offset and
        limit apply per section. Machine output remains complete for large piped
        data.
    cross-seed-dependencies:
      description: Named-Seed and genome-qualified reference syntax resolves against
        another present compiled Seed, rejects self or missing targets, and
        enforces requested genome provenance. Referenced Seeds retain separate
        authority.
    drift:
      description: Seed diff compares compiled YAML and Blueprint diff compares
        constructed semantics against the selected snapshot. Canonical
        dependency drift is reported separately and does not create or expire
        selected-Seed work.
  verification:
    work-queue:
      description: Explicit verification items precede implicit items for addressable
        obligation sections. Claims have owners and leases; stale claims become
        reclaimable, ownership gates transitions, and terminal states are
        confirmed or failed.
    executable-evidence:
      description: Confirm requires every command to pass; fail requires at least one
        to fail. Evidence uses existing unique repository-relative files,
        SHA-256 hashes, Seed-address fingerprints, bounded command diagnostics,
        and the selected repository as command working directory.
    expiry-and-reconciliation:
      description: Missing or changed implementation evidence, absent test commands,
        or changed referenced Seed addresses expire terminal evidence. The
        selected Seed file remains recorded as evidence, but its content-hash
        change does not independently expire an item when semantic Seed
        comparison succeeds; referenced address fingerprints determine that
        expiry. A missing, unreadable, or invalid selected Seed still fails
        visibly. New compiled items enter pending work and removed items leave
        the reconciled queue.
    replay-and-refresh:
      description: check executes each unique stored command once and fans results to
        all uses. refresh-expired is an atomic fast path only for confirmed,
        evidence-file-only expiry with no contract change or other pending work.
    evidence-link-audit:
      description: audit and report surface ordinary warnings when one evidence file
        has a large verification blast radius, many items share an identical
        evidence bundle, or one proof command is coupled across many address
        families. Warnings include affected counts and item IDs, remain advisory
        rather than fabricating semantic certainty, and use the same warning
        channels as all other verification audit findings.
    evidence-repair:
      description: reopen is an explicit fast path for repairing over-broad or
        incorrect evidence ownership without resetting unrelated session
        progress. Exact item IDs reopen immediately; --evidence-file previews
        matching terminal items without mutation unless --apply is supplied.
        Applied reopen operations preserve prior status, support text, files,
        commands, and Seed evidence in item history, then claim each selected
        item for the owner so focused confirm or fail evidence must replace it.
    injection-run:
      description: Injection is a speed-focused SDD mode used only when the operator
        directly requests "SDD injection". The agent changes the Seed first,
        implements the resulting address delta, evaluates only new or modified
        addresses and affected evidence, then uses verify inject with the exact
        operator-requested-sdd-injection authorization acknowledgement to record
        truthful per-command pass or fail attestations without the CLI executing
        those commands. Missing or incorrect authorization fails before any
        state transition. Injected records retain the authorization, owner,
        timestamp, product revision, evidence-file hashes, Seed-address
        fingerprints, and conspicuous provenance in status, audit, and report
        output. They may satisfy and sync the session, while a later verify
        check executes their command strings and replaces the attestations with
        ordinary executable results. Injection is never selected implicitly and
        does not weaken missing-file, changed-address, failure, or
        unsatisfied-session handling.
    completion-and-sync:
      description: completed requires every item terminal; satisfied also requires no
        failed or expired items. sync requires satisfaction, advances current
        Seed and dependency snapshots, and preserves only still-valid terminal
        results.
  distribution:
    package-surface:
      description: npm-compatible packing includes the executable production source,
        packaged genomes, portable skill, README, package metadata, and license;
        tests and the lockfile are repository inputs rather than shipped files.
      artifacts:
        - package-manifest
        - dependency-lock
        - genome-catalog
        - portable-skill
    portable-skill-installation:
      description: Installation stages a recursive copy, omits Codex-specific agent
        metadata for Claude, atomically replaces one seed-lang target, restores
        the prior target on replacement failure, and removes successful backups.
      artifacts:
        - portable-skill
  command-protocol:
    help-and-dispatch:
      description: --help or -h prints global usage and succeeds from any argument
        position. --version is not an implemented command. Unknown commands,
        subcommands, options, unsafe names, and malformed values fail nonzero.
    streams-and-results:
      description: Normal human and machine result data is written to stdout. Parser
        and caught operational exceptions use concise Error-prefixed stderr
        text; validation and verification result diagnostics may remain on
        stdout.
    accessible-plain-output:
      description: Human-readable output remains usable without ANSI decoration.
        Non-TTY output is plain by default; NO_COLOR, TERM=dumb, and supported
        --no-color paths suppress ANSI without removing semantic content.
errors:
  unknown-subcommand: Unknown subcommands fail with a nonzero exit code and a
    helpful error message.
  failure-exit-code: Every failure path exits with a nonzero exit code.
  contract-input:
    description: Missing contracts, malformed YAML, unsupported tags, invalid
      section shapes or IDs, unresolved requirements, bad artifact declarations,
      unresolved references, and invalid policies fail with contextual
      diagnostics.
  repository-paths:
    description: Missing or non-directory --repo targets, missing or duplicate
      --seed, unsafe or reserved names, overwrite attempts, and missing
      snapshots fail without silently selecting another location.
  genomes:
    description: Operations that load, compile, blueprint, or validate genomes fail
      for unknown or malformed definitions, malformed or unmatched selectors and
      exclusions, broken references, cycles, and recursion overflow with
      relevant genome or source context. Genome search rejects a missing query
      or unknown option. Genome listing and search may retain a malformed entry
      for an ID match while omitting unavailable metadata and address matches.
  cross-seed-references:
    description: Missing source Seeds or addresses, self-reference, and genome
      provenance mismatch fail without taking verification ownership of the
      source Seed.
  verification:
    description: Corrupt state, invalid transitions, wrong owners, missing or unsafe
      evidence, malformed or contradictory injection attestations, failed proof
      commands, incomplete audits, expiry, and unsatisfied sync fail visibly
      while retaining bounded command diagnostics where applicable.
  skill-installation:
    description: Missing or conflicting platform choice, unsupported targets,
      missing bundled skill content, and filesystem replacement failures fail
      and preserve or restore the prior installation when replacement began.
observability:
  exit-code-zero-success: Exit code 0 means the requested operation completed successfully.
  exit-code-nonzero-failure: Nonzero exit codes mean validation, input, usage, or execution failure.
  diagnostics:
    description: Command exit status is authoritative. Error text identifies the
      failed operation, while verification command records retain exit code,
      signal, timeout state, duration, and visibly truncated stdout and stderr.
  provenance:
    description: Constructed items expose exact addresses and winning Seed or genome
      source provenance; cross-Seed dependencies expose source path and
      provenance.
  verification-views:
    description: pending, status, audit, and report expose nonterminal work, expiry,
      failures, policy coverage, evidence files, executed versus injected
      commands, injection owners, and aggregate completion.
compatibility:
  npm-package-interface: Published package entry points and exported files must
    not change without a Seed change.
  seed-language:
    description: Required section names, address normalization, reference syntax,
      policy defaults, metadata tags, artifact attachment, requirements gate,
      and verification item shape are contract-language compatibility surfaces.
  selected-paths:
    description: seed/seed.yml and .seed are master paths; seed/NAME and .seed/NAME
      are named paths. Safe-name rules and master reservation are stable path
      semantics.
  genome-catalog:
    description: The 217 built-in IDs present in @genome-catalog are current
      compatibility surfaces. The retired verify-gli-golden-output alias is not
      supported.
    artifacts:
      - genome-catalog
  package-surface:
    description: The seed executable and files selected by @package-manifest remain
      npm-compatible. Observable changes require an intentional Seed change.
    artifacts:
      - package-manifest
  prototype-evolution:
    description: Human wording and internal details may evolve during the prototype,
      but command semantics, machine data, paths, formats, and state meaning do
      not change accidentally.
state:
  filesystem:
    description: Durable state is stored in local files under documented
      project-controlled paths.
    persistence: filesystem
    semantics: local-filesystem-persistence
  selected-seed:
    description: Authored master or named Seed files remain separate from generated
      .seed snapshots, dependency snapshots, session ledgers, and lock
      directories.
    persistence: filesystem
    consistency: selected-seed-isolation
    semantics: authored-contract-and-generated-verification-state
  genome-sources:
    description: Packaged, user, and repository genome sources remain distinct and
      are re-read for each compilation according to precedence.
    persistence: filesystem
    semantics: ordered-source-overrides
  verification-session:
    description: Session ledgers store claims, attempts, evidence hashes, executed
      or explicitly injected command results, address fingerprints, and
      aggregate state. Per-session locks serialize updates and JSON ledgers use
      temporary-file atomic replacement.
    persistence: filesystem
    consistency: lock-serialized-session-updates
    semantics: incremental-verification-ledger
  skill-targets:
    description: Explicit install-skill operations persist outside the repository
      under CODEX_HOME or CLAUDE_HOME, falling back to platform-specific
      directories under HOME.
    persistence: filesystem
    semantics: explicit-user-skill-installation
security:
  filesystem-path-boundary:
    description: State files must stay inside documented project or user data directories.
    policy: global
  dependency-minimal:
    description: Dependencies should be limited to those needed to satisfy the Seed
      and maintained enough for the project risk profile.
    policy: global
  repository-boundaries:
    description: Selected contract, verification state, repository genomes, and
      evidence paths resolve from the chosen repository. Deliberate exceptions
      are user genomes and explicit Codex or Claude skill installation
      destinations.
    policy: global
  validated-identifiers-and-evidence:
    description: Seed/session names and evidence paths are normalized and checked;
      evidence rejects empty, absolute, root, traversal, duplicate, and missing
      paths.
    policy: global
  trusted-proof-command-interface:
    description: Verification test commands are trusted operator-provided shell
      strings, executed unchanged from the selected repository with a timeout
      and bounded captured output. They are not an untrusted command-sandbox
      boundary.
    policy: global
  injection-authorization:
    description: verify inject rejects every call unless it includes the exact
      --authorization operator-requested-sdd-injection acknowledgement. Skills
      and agents may supply that acknowledgement only after the operator
      directly requests an SDD injection run. The acknowledgement is a
      hash-bound, auditable caller attestation, not cryptographic proof of
      conversation history or operator identity.
    policy: global
  trusted-pager-interface:
    description: PAGER is trusted operator environment input and is shell-executed
      only when an operator explicitly requests paging.
    policy: global
verifications:
  unit-tests:
    title: Unit tests pass
    description: Verify isolated Seed-critical behavior through the repository test suite.
    method: Run npm test from the repository root as the shared test producer.
    evidence_required:
      - Exact npm test command and exit status.
      - Complete passing summary or failing diagnostics from all test files.
      - Confirmation that fixture repositories and homes were disposable and
        cleaned.
    artifacts:
      - test-contract
  integration-tests:
    title: Integration tests pass
    description: Verify integrated CLI and filesystem workflows through the
      repository test suite.
    method: Run npm test from the repository root as the shared test producer.
    evidence_required:
      - Exact npm test command and exit status.
      - Complete passing summary or failing diagnostics from all test files.
      - Confirmation that fixture repositories and homes were disposable and
        cleaned.
    artifacts:
      - test-contract
  repo-readme:
    title: Repository README is accurate and safely executable
    description: Verify @repo-readme contains the actual project entrypoint
      information, inventory every shell command, and use @seed-evidence-scripts
      to exercise safe real CLI paths only in disposable repository and
      user-home locations.
    artifacts:
      - repo-readme
      - seed-evidence-scripts
    method: Reuse npm test as the shared test producer, then run node
      seed/scripts/verify-readme.js from the repository root. The verifier
      classifies every README shell command, rejects unknown command forms, and
      executes representative project, genome, verification, named-Seed, and
      skill-installation paths under a temporary repository, HOME, CODEX_HOME,
      and CLAUDE_HOME that it removes in a finally block.
      Network/global-install, placeholder, interactive pager, and terminal
      evidence-transition examples are inspected but not executed.
    evidence_required:
      - Exact npm test and README verifier commands with exit statuses.
      - Complete command-inventory diagnostics on failure.
      - Confirmation that repository files and real user skill homes were
        unchanged.
  repo-license:
    title: Repository license is explicit and consistent
    description: Verify the authoritative license text and every repository artifact
      that actually declares the root package license agree on MIT without
      treating dependency licenses or README prose as project license
      declarations.
    method: Run node seed/scripts/verify-license.js from the repository root. The
      verifier parses package.json and package-lock.json, checks the root
      package entries, and validates the identifying MIT text in LICENSE with
      complete assertion diagnostics on mismatch.
    evidence_required:
      - Exact verifier command and exit status.
      - Parsed root package and lockfile license identifiers.
      - LICENSE identification and mismatch diagnostics.
    artifacts:
      - repo-license
      - package-manifest
      - dependency-lock
      - seed-evidence-scripts
  contract-language-behavior:
    title: Seed language and reference behavior passes
    description: Exercise real parsing, validation, requirements, artifact, policy,
      default and named path, and cross-Seed reference behavior from
      @source-contract through @test-contract.
    method: Run node --test test/validation.test.js test/seed-file.test.js
      test/external-references.test.js from the repository root.
    evidence_required:
      - Exact command and exit status.
      - Passing test summary or complete failing diagnostics.
      - Confirmation that tests used temporary repositories and did not alter
        production state.
    artifacts:
      - source-contract
      - test-contract
  genome-catalog-behavior:
    title: Built-in genome catalog and compiler passes
    description: Validate every packaged genome and exercise lookup, composition,
      selectors, exclusions, merge semantics, provenance, and failure paths.
    method: Run node src/cli.js genome validate --builtin and node --test
      test/genomes.test.js from the repository root.
    evidence_required:
      - Both exact commands and exit statuses.
      - Validated built-in count and passing focused test summary.
      - Assertions covering /tmp isolation and deployment-genome cleanup after
        configurable runtime-identity tests.
      - Assertions covering every pinned GitHub license template, its
        repo-license-* genome, inherited LICENSE artifact, GitHub key, reported
        SPDX identifier, and selection verification contract.
      - Full diagnostics for any invalid genome or failed compiler case.
    artifacts:
      - genome-catalog
      - github-license-template-catalog
      - test-contract
  genome-search-behavior:
    title: Genome metadata and search behavior passes
    description: Verify optional metadata tags and @behavior.genomes.search across
      built-in, user, and repository genome definitions.
    method: Run node --test test/validation.test.js test/genomes.test.js
      test/cli.test.js from the repository root, including disposable tagged and
      malformed genome fixtures.
    evidence_required:
      - Exact command and exit status.
      - Valid and invalid metadata tag diagnostics.
      - ID, name, description, tag, address, opt-in full-text, origin-filter,
        deterministic-order, and no-result search assertions.
      - Output assertions showing genome IDs, origins, tags, match types, and
        matching direct addresses.
    artifacts:
      - source-contract
      - genome-catalog
      - test-contract
  semantic-cli-workflows:
    title: Non-visual CLI workflows pass
    description: Exercise repository routing, named Seeds, references, validation,
      diffs, verification transitions, large machine output, and @portable-skill
      installation without treating terminal presentation assertions as master
      acceptance.
    method: Run npm test from the repository root as the shared test producer.
    evidence_required:
      - Exact npm test command and exit status.
      - Passing summary or complete CLI workflow diagnostics.
      - Confirmation that temporary homes and repositories were disposable and
        cleaned.
    artifacts:
      - test-contract
      - portable-skill
  accessible-plain-output:
    title: ANSI-free output preserves semantic content
    description: Exercise non-TTY, NO_COLOR, TERM=dumb, and supported --no-color
      paths and confirm they suppress ANSI without losing readable command
      content.
    method: Run npm test from the repository root as the shared test producer.
    evidence_required:
      - Exact npm test command and exit status.
      - Passing terminal-markdown and CLI assertions for every ANSI-suppression
        path.
      - Complete diagnostics if plain output loses content or contains
        unexpected ANSI.
    artifacts:
      - source-contract
      - test-contract
  skill-installation-rollback:
    title: Failed skill replacement restores the prior installation
    description: Use @seed-evidence-scripts to inject a controlled failure after the
      existing skill has been moved to its backup and prove the real CLI fails
      nonzero without losing prior content or leaving a partial staged target.
    method: Run node seed/scripts/verify-skill-installer-rollback.js from the
      repository root using only the disposable CODEX_HOME created and removed
      by the script.
    evidence_required:
      - Exact verifier command and exit status.
      - Nonzero nested CLI result and preserved controlled-failure diagnostics.
      - Intact prior marker plus absence of partial target, backup, and staging
        paths.
    artifacts:
      - source-contract
      - portable-skill
      - seed-evidence-scripts
  verification-lifecycle-behavior:
    title: Verification ledger behavior passes
    description: Exercise claims, leases, locks, evidence commands, hashes, expiry,
      reconciliation, replay, refresh, audit, report, completion, and sync.
    method: Run node --test test/verification-store.test.js from the repository root.
    evidence_required:
      - Exact command and exit status.
      - Passing summary or complete state-machine diagnostics.
      - Assertions that master and named Seed evidence ignores only redundant
        content-hash changes while referenced address changes and missing or
        invalid selected Seeds remain visible.
      - Assertions that injection rejects missing or incorrect
        operator-requested-sdd-injection authorization before state changes, and
        stores the exact authorization in hash-bound provenance.
      - Assertions that explicit injected pass and fail attestations never
        execute during injection, retain owner and revision provenance, remain
        hash- and address-expirable, appear in status and report, can sync only
        when satisfied, and are replaced by executable results during check.
      - Assertions that evidence-link fanout, repeated bundles, and broad
        shared-command coupling appear through ordinary audit and report
        warnings with bounded affected-item detail.
      - Assertions that reopen rejects nonterminal or unknown items, previews
        evidence-file matches without mutation, requires explicit --apply for
        batch mutation, preserves complete prior terminal evidence history, and
        claims only selected items for focused replacement evidence.
      - Confirmation that only disposable fixture repositories were mutated.
    artifacts:
      - test-contract
  package-surface-behavior:
    title: Unpublished npm package surface is reproducible
    description: Inspect the npm-compatible pack result without publishing or
      writing a production package artifact.
    method: Run npm pack --dry-run --json from the repository root and inspect its
      file list.
    evidence_required:
      - Exact command and exit status.
      - Package name, version, executable mode, and included file inventory.
      - Confirmation that src, resources, README, package metadata, and license
        are present and tests are absent.
    artifacts:
      - package-manifest
      - dependency-lock
      - portable-skill
      - genome-catalog
  master-boundary-review:
    title: Master contract boundaries remain honest
    description: Inspect the complete constructed blueprint and confirm requirements
      is empty, authoritative artifacts exist, only honest genome subsets are
      active, and deferred presentation or near-fit work remains outside master.
    method: Run seed validate and seed blueprint --json from the repository root,
      then inspect all sections and artifacts.
    evidence_required:
      - Successful validation output.
      - Complete blueprint item and global-policy counts.
      - Artifact existence review and deferred-boundary confirmation.
    artifacts:
      - distillation-exclusions
artifacts:
  repo-readme:
    path: README.md
    description: Root repository introduction and operating guide.
  repo-license:
    path: LICENSE
    description: Authoritative repository license text selected by the project owner.
  package-manifest:
    path: package.json
    description: Authoritative npm metadata, executable entry point, package
      surface, and runtime dependency declaration.
  dependency-lock:
    path: package-lock.json
    description: Authoritative npm dependency resolution and integrity lock.
  genome-catalog:
    path: resources/genomes
    description: Authoritative packaged YAML definitions for every built-in genome.
  github-license-template-catalog:
    path: seed/github-license-templates.yml
    description: Pinned inventory of the standard license templates exposed by the
      GitHub Licenses API for the built-in repository-license selection genomes.
  portable-skill:
    path: resources/skills/seed-lang
    description: Authoritative portable Seed workflow skill and its command,
      readiness, and SDD references.
  source-contract:
    path: src
    description: Production implementation that defines the current as-built
      command, format, and state behavior.
  test-contract:
    path: test
    description: Existing deterministic tests for production Seed behavior.
  distillation-exclusions:
    path: seed/distillation-exclusions.md
    description: Complete deferred visual-interface inventory and near-fit non-UI
      genome review.
  seed-evidence-scripts:
    path: seed/scripts
    description: Deterministic disposable-state checks needed beyond the existing
      test suite.
genomes:
  - cli-nodejs[environment.npm-install,constraints.nodejs-cli-runtime,freedom.nodejs-cli-structure]
  - cli-subcommands
  - cli-exit-codes
  - package-npm
  - state-filesystem
  - verify-unit-tests
  - verify-integration-tests
  - repo-readme
  - policy-dependency-minimal
requirements: []
scope:
  included:
    contract-language:
      description: YAML Seed contracts, their addressable sections, requirements
        readiness, artifacts, policies, references, genomes, and validation
        rules.
    repository-workflows:
      description: Default and named Seed selection, initialization, discovery,
        compiled blueprints and diffs, and repository-local verification state.
    verification-lifecycle:
      description: Claim-based executable evidence, expiry, replay, audit, report,
        status, synchronization, and cross-Seed dependency inspection.
    distribution:
      description: The public MIT source repository, unpublished npm-compatible
        package, seed executable, packaged genome catalog, and portable Codex
        and Claude Seed skill.
  excluded:
    artifacts:
      - distillation-exclusions
    visual-ui:
      description: Visual layout, styling, ANSI palette, terminal cell geometry,
        wrapping, pager choreography, screenshots, golden frames, and
        documentation imagery are separate UI authority documented by
        @distillation-exclusions.
      artifacts:
        - distillation-exclusions
