metadata:
  name: repo-license-mpl-2-0
  summary: MPL-2.0 repository license selection contract.
  description: Selects the GitHub Mozilla Public License 2.0 template for the repository.
  tags: [repository, license, weak-copyleft, mozilla]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects Mozilla Public License 2.0 using GitHub license key mpl-2.0 and GitHub-reported SPDX identifier MPL-2.0; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses Mozilla Public License 2.0
    description: Verify the owner-selected license artifact and repository metadata match GitHub key mpl-2.0 and SPDX identifier MPL-2.0.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key mpl-2.0 and SPDX identifier MPL-2.0.
      - Package, documentation, and source-notice consistency results.
