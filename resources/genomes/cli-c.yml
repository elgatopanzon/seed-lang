metadata:
  name: cli-c
  summary: C command line application contract.
  description: Adds C runtime and project structure expectations for CLI implementations.
genomes:
  - cli-interface
interfaces:
  cli:
    purpose: User invokes the project from a terminal as a C CLI.
    examples:
      - ./<command> --help
      - <command> --help
environment:
  c-runtime: Must build to a native C command line executable for the target platform.
  c-build: Build steps and required C compiler/toolchain must be documented or
    automated by the project.
  linux: Must run on Linux shells unless the Seed narrows supported platforms.
security:
  no-secret-output: Must not print environment variables, tokens, or credentials
    unless explicitly required by the Seed.
constraints:
  cli-c-runtime: The implementation is a C command line application.
freedom:
  cli-c-structure: Implementation may choose any maintainable internal C project structure.
