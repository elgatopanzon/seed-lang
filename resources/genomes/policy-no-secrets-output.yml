metadata:
  name: policy-no-secrets-output
  summary: No secrets output policy contract.
  description: Forbids printing secrets, tokens, credentials, or secret-like environment values.
security:
  no-secrets-output:
    description: Outputs, logs, and errors must not disclose secrets, tokens, credentials, or private environment values.
    policy: global
constraints:
  no-secret-disclosure: Secret-like values must be redacted or omitted from user-visible and machine-readable output.
