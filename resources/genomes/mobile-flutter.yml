metadata:
  name: mobile-flutter
  summary: Flutter mobile client contract.
  description: Adds Flutter mobile application implementation expectations.
genomes:
  - mobile-app
environment:
  flutter-framework: The mobile client is implemented with Flutter and Dart or a
