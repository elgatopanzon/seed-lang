metadata:
  name: repo-secret-hygiene
  summary: Repository secret-exposure prevention contract.
  description: Forbids committed credentials and requires current-tree and history scanning with explicit findings handling.
security:
  no-committed-secrets:
    description: The current tree and version-control history contain no active credentials, private keys, tokens, passwords, or equivalent secret material.
    policy: global
constraints:
  repository-secret-scanning:
    description: A focused automated scan covers both the current tree and reachable repository history, fails on unresolved findings, and records narrowly justified false positives.
    policy: global
  no-secret-values-in-evidence:
    description: Scan output, logs, diffs, and verification evidence redact secret values while retaining actionable file, commit, rule, and remediation context.
    policy: global
verifications:
  repo-secret-hygiene:
    title: Current tree and history contain no unresolved secrets
    description: Verify focused secret scans cover the current tree and reachable history with redacted, reviewable findings.
    method: Run the declared current-tree and history secret scans and review every finding or suppression.
    evidence_required:
      - Focused scan commands, coverage, and redacted results.
      - Findings disposition and remediation evidence.
      - False-positive suppressions with narrow justification.
      - Demonstration that a seeded test secret causes scan failure.
