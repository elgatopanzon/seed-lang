metadata:
  name: cli-go
  summary: Go command line application contract.
  description: Adds Go runtime and project structure expectations for CLI implementations.
genomes:
  - cli-interface
interfaces:
  cli:
    purpose: User invokes the project from a terminal as a Go CLI.
    examples:
      - go run . --help
      - <command> --help
environment:
  go-runtime: Must build to a Go command line executable using a supported Go toolchain.
  go-modules: Dependencies are declared with Go modules when external packages are
    required.
  linux: Must run on Linux shells unless the Seed narrows supported platforms.
security:
  no-secret-output: Must not print environment variables, tokens, or credentials
    unless explicitly required by the Seed.
constraints:
  cli-go-runtime: The implementation is a Go command line application.
freedom:
  cli-go-structure: Implementation may choose any maintainable internal Go project structure.
