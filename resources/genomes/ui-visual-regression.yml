metadata:
  name: ui-visual-regression
  summary: Deterministic UI visual regression contract.
  description: Requires independently approved golden frames, exact production-render comparisons, readable diffs, and explicit baseline updates.
behavior:
  deterministic-production-rendering: Identical declared UI state, content, viewport,
    environment, and rendering inputs produce an identical frame through the production rendering path.
  exact-frame-comparison: Visual checks compare the complete produced frame with its approved golden exactly rather than sampling labels or selected regions.
  readable-visual-diffs: A mismatch produces a readable diff that identifies the golden, produced frame, and changed regions or cells.
constraints:
  checked-in-approved-goldens:
    description: Golden frames are checked-in project artifacts whose approval source and applicable screen state are explicit.
    policy: global
  independent-visual-baselines:
    description: A baseline generated by the implementation under test does not count as independent evidence unless it is separately reviewed and approved.
    policy: global
  explicit-baseline-update-workflow:
    description: Golden changes use an explicit reviewable update workflow and are never silently accepted during ordinary test execution.
    policy: global
  claim-specific-visual-commands:
    description: Each visual claim names a focused executable command; a generic whole-suite command is not sufficient as its sole evidence.
    policy: global
  visual-evidence-artifacts:
    description: Each visual claim declares the approved golden and produced frame as project artifacts and records both paths in verification evidence.
    policy: global
  visual-mutation-proof:
    description: The visual harness demonstrates that an intentional layout corruption causes its focused comparison command to fail.
    policy: global
verifications:
  visual-regression:
    title: Production UI matches approved golden frames
    description: Verify representative production-rendered UI states match independently approved golden frames exactly and produce readable diagnostics on mismatch.
    method: Run each named visual claim command against its declared fixture and viewport, then exercise the documented intentional-corruption check.
    evidence_required:
      - Focused command for each visual claim and its passing output.
      - Approved golden artifact path and produced frame artifact path for each claim.
      - Rendering inputs, fixture, viewport, and production entrypoint used.
      - Readable diff from an intentional layout corruption that made the command fail.
      - Baseline approval source and baseline-update workflow.
