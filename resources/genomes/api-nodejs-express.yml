metadata:
  name: api-nodejs-express
  summary: Node.js Express API backend contract.
  description: Adds Express-based Node.js HTTP API implementation expectations.
genomes:
  - cli-nodejs
  - api-http
environment:
  express-framework: The backend uses Express or an Express-compatible request handler model.
