metadata:
  name: repo-license-epl-2-0
  summary: EPL-2.0 repository license selection contract.
  description: Selects the GitHub Eclipse Public License 2.0 template for the repository.
  tags: [repository, license, copyleft, eclipse]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects Eclipse Public License 2.0 using GitHub license key epl-2.0 and GitHub-reported SPDX identifier EPL-2.0; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses Eclipse Public License 2.0
    description: Verify the owner-selected license artifact and repository metadata match GitHub key epl-2.0 and SPDX identifier EPL-2.0.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key epl-2.0 and SPDX identifier EPL-2.0.
      - Package, documentation, and source-notice consistency results.
