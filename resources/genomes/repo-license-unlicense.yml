metadata:
  name: repo-license-unlicense
  summary: Unlicense repository license selection contract.
  description: Selects the GitHub Unlicense template for the repository.
  tags: [repository, license, public-domain, unlicense]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects The Unlicense using GitHub license key unlicense and GitHub-reported SPDX identifier Unlicense; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses The Unlicense
    description: Verify the owner-selected license artifact and repository metadata match GitHub key unlicense and SPDX identifier Unlicense.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key unlicense and SPDX identifier Unlicense.
      - Package, documentation, and source-notice consistency results.
