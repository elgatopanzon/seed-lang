metadata:
  name: repo-license-lgpl-2-1
  summary: LGPL-2.1 repository license selection contract.
  description: Selects the GitHub GNU Lesser General Public License v2.1 template for the repository.
  tags: [repository, license, weak-copyleft, gnu]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects GNU Lesser General Public License v2.1 using GitHub license key lgpl-2.1 and GitHub-reported SPDX identifier LGPL-2.1; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses GNU Lesser General Public License v2.1
    description: Verify the owner-selected license artifact and repository metadata match GitHub key lgpl-2.1 and SPDX identifier LGPL-2.1.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key lgpl-2.1 and SPDX identifier LGPL-2.1.
      - Package, documentation, and source-notice consistency results.
