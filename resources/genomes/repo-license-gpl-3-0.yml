metadata:
  name: repo-license-gpl-3-0
  summary: GPL-3.0 repository license selection contract.
  description: Selects the GitHub GNU General Public License v3.0 template for the repository.
  tags: [repository, license, copyleft, gnu]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects GNU General Public License v3.0 using GitHub license key gpl-3.0 and GitHub-reported SPDX identifier GPL-3.0; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses GNU General Public License v3.0
    description: Verify the owner-selected license artifact and repository metadata match GitHub key gpl-3.0 and SPDX identifier GPL-3.0.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key gpl-3.0 and SPDX identifier GPL-3.0.
      - Package, documentation, and source-notice consistency results.
