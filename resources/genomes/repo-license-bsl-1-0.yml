metadata:
  name: repo-license-bsl-1-0
  summary: BSL-1.0 repository license selection contract.
  description: Selects the GitHub Boost Software License 1.0 template for the repository.
  tags: [repository, license, permissive, boost]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects Boost Software License 1.0 using GitHub license key bsl-1.0 and GitHub-reported SPDX identifier BSL-1.0; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses Boost Software License 1.0
    description: Verify the owner-selected license artifact and repository metadata match GitHub key bsl-1.0 and SPDX identifier BSL-1.0.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key bsl-1.0 and SPDX identifier BSL-1.0.
      - Package, documentation, and source-notice consistency results.
