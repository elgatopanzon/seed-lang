metadata:
  name: repo-license-apache-2-0
  summary: Apache-2.0 repository license selection contract.
  description: Selects the GitHub Apache License 2.0 template for the repository.
  tags: [repository, license, permissive, patent]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects Apache License 2.0 using GitHub license key apache-2.0 and GitHub-reported SPDX identifier Apache-2.0; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses Apache License 2.0
    description: Verify the owner-selected license artifact and repository metadata match GitHub key apache-2.0 and SPDX identifier Apache-2.0.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key apache-2.0 and SPDX identifier Apache-2.0.
      - Package, documentation, and source-notice consistency results.
