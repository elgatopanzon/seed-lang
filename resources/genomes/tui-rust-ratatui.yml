metadata:
  name: tui-rust-ratatui
  summary: Rust Ratatui TUI client contract.
  description: Adds Ratatui-based Rust terminal UI implementation expectations.
genomes:
  - tui-client
  - cli-rust
environment:
  ratatui-runtime: The TUI is implemented with Ratatui or a compatible Rust terminal UI stack.
constraints:
  ratatui-tui-runtime: The target project uses Rust Ratatui for the terminal UI.
