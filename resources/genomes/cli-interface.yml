metadata:
  name: cli-interface
  summary: Baseline command line interface contract.
  description: Defines a generic terminal CLI interface with help, stderr errors,
    and exit-code expectations.
interfaces:
  cli:
    purpose: User invokes the project from a terminal as a CLI.
    examples:
      - <command> --help
observability:
  stderr-errors: User-facing errors must be written to stderr.
  exit-codes: Exit code 0 means success; nonzero means validation, input, or
    execution failure.
