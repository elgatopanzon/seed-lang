metadata:
  name: tui-js-blessed
  summary: JavaScript neo-blessed TUI client contract.
  description: Adds maintained neo-blessed JavaScript terminal UI implementation expectations.
genomes:
  - cli-tui
  - cli-nodejs
environment:
  neo-blessed-runtime: The TUI is implemented with the maintained neo-blessed
    JavaScript package.
constraints:
  neo-blessed-tui-runtime: The target project uses the maintained neo-blessed package for the JavaScript terminal UI.
  no-original-blessed: The target project must not use the unmaintained original blessed package.
