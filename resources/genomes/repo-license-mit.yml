metadata:
  name: repo-license-mit
  summary: MIT repository license selection contract.
  description: Selects the GitHub MIT License template for the repository.
  tags: [repository, license, permissive, mit]
genomes:
  - repo-license
constraints:
  selected-repository-license:
    description: The project owner selects MIT License using GitHub license key mit and GitHub-reported SPDX identifier MIT; @repo-license and applicable repository metadata identify those terms consistently.
    artifacts: [repo-license]
    policy: global
verifications:
  repo-license-selection:
    title: Repository uses MIT License
    description: Verify the owner-selected license artifact and repository metadata match GitHub key mit and SPDX identifier MIT.
    artifacts: [repo-license]
    method: Inspect LICENSE and every applicable repository metadata surface for the selected GitHub license key, SPDX identifier, and matching terms.
    evidence_required:
      - LICENSE identification and matching copyright or attribution fields.
      - GitHub license key mit and SPDX identifier MIT.
      - Package, documentation, and source-notice consistency results.
