metadata:
  name: cli-rust
  summary: Rust command line application contract.
  description: Adds Rust runtime and project structure expectations for CLI implementations.
genomes:
  - cli-interface
interfaces:
  cli:
    purpose: User invokes the project from a terminal as a Rust CLI.
    examples:
      - cargo run -- --help
      - <command> --help
environment:
  rust-runtime: Must build to a Rust command line executable using Cargo unless
    the Seed narrows the toolchain.
  cargo-build: Dependencies are declared in Cargo.toml and build/test commands use
    Cargo by default.
  linux: Must run on Linux shells unless the Seed narrows supported platforms.
security:
  no-secret-output: Must not print environment variables, tokens, or credentials
    unless explicitly required by the Seed.
constraints:
  cli-rust-runtime: The implementation is a Rust command line application.
freedom:
  cli-rust-structure: Implementation may choose any maintainable internal Rust project structure.
