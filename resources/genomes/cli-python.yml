metadata:
  name: cli-python
  summary: Python command line application contract.
  description: Adds Python runtime and project structure expectations for CLI
    implementations.
genomes:
  - cli-interface
interfaces:
  cli:
    purpose: User invokes the project from a terminal as a Python CLI.
    examples:
      - python <module-or-script> --help
      - <command> --help
environment:
  python-runtime: Must run on Python 3.11 or newer unless the Seed narrows the version.
  python-packaging: Dependencies are declared with standard Python project
    metadata such as pyproject.toml or requirements.txt.
  linux: Must run on Linux shells unless the Seed narrows supported platforms.
security:
  no-secret-output: Must not print environment variables, tokens, or credentials
    unless explicitly required by the Seed.
constraints:
  cli-python-runtime: The implementation is a Python command line application.
freedom:
  cli-python-structure: Implementation may choose any maintainable internal Python project structure.
