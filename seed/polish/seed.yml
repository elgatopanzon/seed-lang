metadata:
  name: seed-lang
  summary: >-
    Private Node.js CLI and contract language for authoring, composing,
    inspecting, diffing, and verifying Seed software contracts.
  description: >-
    Defines the as-built Seed document model, reusable genome compiler,
    constructed blueprint and diff views, executable verification ledger, and
    private package and portable-skill distribution surfaces.

genomes:
  - cli-nodejs[environment.npm-install,constraints.nodejs-cli-runtime,freedom.nodejs-cli-structure]
  - cli-subcommands
  - cli-exit-codes
  - package-npm
  - state-filesystem
  - verify-unit-tests
  - verify-integration-tests
  - repo-readme
  - policy-dependency-minimal

requirements: []

scope:
  included:
    contract-language:
      description: >-
        YAML Seed contracts, their addressable sections, requirements readiness,
        artifacts, policies, references, genomes, and validation rules.
    repository-workflows:
      description: >-
        Default and named Seed selection, initialization, discovery, compiled
        blueprints and diffs, and repository-local verification state.
    verification-lifecycle:
      description: >-
        Claim-based executable evidence, expiry, replay, audit, report, status,
        synchronization, and cross-Seed dependency inspection.
    distribution:
      description: >-
        The private npm-compatible package, seed executable, packaged genome
        catalog, and portable Codex and Claude Seed skill.
  excluded:
    artifacts:
      - distillation-exclusions
    visual-ui:
      description: >-
        Visual layout, styling, ANSI palette, terminal cell geometry, wrapping,
        pager choreography, screenshots, golden frames, and documentation
        imagery are separate UI authority documented by @distillation-exclusions.
      artifacts:
        - distillation-exclusions

artifacts:
  repo-license:
    path: LICENSE
    description: Authoritative repository license text selected by the project owner.
  package-manifest:
    path: package.json
    description: Authoritative npm metadata, executable entry point, package surface, and runtime dependency declaration.
  dependency-lock:
    path: package-lock.json
    description: Authoritative npm dependency resolution and integrity lock.
  genome-catalog:
    path: resources/genomes
    description: Authoritative packaged YAML definitions for every built-in genome.
  portable-skill:
    path: resources/skills/seed-lang
    description: Authoritative portable Seed workflow skill and its command, readiness, and SDD references.
  source-contract:
    path: src
    description: Production implementation that defines the current as-built command, format, and state behavior.
  test-contract:
    path: test
    description: Existing deterministic tests for production Seed behavior.
  distillation-exclusions:
    path: seed/distillation-exclusions.md
    description: Complete deferred visual-interface inventory and near-fit non-UI genome review.
  seed-evidence-scripts:
    path: seed/scripts
    description: >-
      Repository-owned Seed evidence orchestration and read-only evidence
      assertions that complement the native Node test suite.

interfaces:
  cli:
    executable:
      description: >-
        The package exposes one seed executable backed by src/cli.js. It accepts
        a leading --repo path, one optional --seed name, global --help or -h,
        and named command families.
      examples:
        - seed --help
        - seed --repo PATH validate
        - seed --seed NAME blueprint --json
      artifacts:
        - package-manifest
        - source-contract
    project-commands:
      description: >-
        init, list, validate, diff, and blueprint operate on the selected Seed;
        blueprint exposes human-readable or JSON contract data and semantic
        selection, while diff compares against the selected verification snapshot.
      examples:
        - seed init --genome cli-nodejs
        - seed list
        - seed validate
        - seed diff
        - seed blueprint --json --filter @behavior.genomes.resolution
    genome-commands:
      description: >-
        genome list, init, validate, and blueprint expose built-in, user, and
        repository genome discovery and inspection.
      examples:
        - seed genome list --builtin
        - seed genome validate --builtin
        - seed genome blueprint cli-nodejs --json
      artifacts:
        - genome-catalog
    verification-commands:
      description: >-
        verify start, reset, pending, next, claim, confirm, fail, check,
        refresh-expired, audit, report, status, sync expose the verification
        state machine. Confirm and fail require an owner, evidence files, and
        executable test commands.
      examples:
        - seed verify start
        - seed verify next --owner agent
        - seed verify confirm ITEM --owner agent --file PATH --test-cmd COMMAND
        - seed verify status
    skill-installation:
      description: >-
        install-skill requires exactly one of --codex or --claude and installs
        the packaged Seed skill into the selected platform's configured user
        skill root.
      examples:
        - seed install-skill --codex
        - seed install-skill --claude
      artifacts:
        - portable-skill
  files:
    artifacts:
      - genome-catalog
    examples:
      - seed/seed.yml
      - .seed/seed.snapshot.yml
    authored-contracts:
      description: >-
        Master uses seed/seed.yml and seed/scripts; named Seeds use
        seed/NAME/seed.yml and seed/NAME/scripts.
      examples:
        - seed/seed.yml
        - seed/release/seed.yml
    generated-verification-state:
      description: >-
        Master state is under .seed and named state under .seed/NAME, including
        snapshots, dependency snapshots, sessions, and transient locks.
      examples:
        - .seed/seed.snapshot.yml
        - .seed/release/sessions/default.json
    genome-origins:
      description: >-
        Built-ins come from @genome-catalog, user overrides from
        ~/.seed/genomes, and repository overrides from seed/genomes.
      artifacts:
        - genome-catalog
      examples:
        - resources/genomes/cli-nodejs.yml
        - seed/genomes/project-policy.yml
  package:
    artifacts:
      - package-manifest
      - dependency-lock
    examples:
      - npm pack --dry-run --json
    npm-compatible:
      description: >-
        @package-manifest and @dependency-lock define a private, locally
        installable and packable npm package containing src, resources, README,
        package metadata, and the MIT license.
      artifacts:
        - package-manifest
        - dependency-lock
      examples:
        - npm install -g .
        - seed --help

behavior:
  readme-content:
    description: >-
      The root README states product purpose and prototype status, prerequisites,
      repository and skill installation, quick-start usage, Seed structure,
      genomes, blueprints and diffs, standalone verification workflow, command
      summary, repository layout, development checks, and current boundaries.
    artifacts:
      - repo-readme
  contract-language:
    document-model:
      description: >-
        A Seed is YAML with required metadata and nonempty scope, interfaces,
        behavior, constraints, freedom, and verifications sections; errors may
        be empty. Optional addressable sections are artifacts, state, security,
        environment, observability, and compatibility.
    address-normalization:
      description: >-
        Addressable trees and ID-bearing lists compile into unique dotted
        addresses. IDs start alphanumeric and contain only letters, numbers,
        underscores, and hyphens. Known item properties remain fields rather
        than child addresses.
    requirements-readiness:
      description: >-
        requirements is a temporary planning inbox. Blueprint and diff expose
        unresolved entries, but validation and verification start fail until it
        is absent or empty and the entries have been converted into the contract.
    artifacts-and-references:
      description: >-
        Artifacts use repository-relative paths or HTTP(S) URLs and require
        descriptions. Items that mention local artifacts declare their IDs.
        Local, cross-Seed, and genome-qualified references must resolve or fail.
    policies:
      description: >-
        Ordinary items default to local policy, security items default global,
        and explicit global policy items are supplied as context for every
        verification claim and checked by audit.
  repository-selection:
    default-and-named-seeds:
      description: >-
        The default Seed is master. Named Seeds use safe non-master names and
        isolated authored and generated paths. Listing reports master first and
        then safe named Seeds in lexical order.
    initialization:
      description: >-
        init validates requested genomes before writes, creates only the selected
        contract and scripts directory, refuses replacement unless --overwrite,
        and idempotently ignores only .seed/locks in a seed-lang gitignore block.
  genomes:
    resolution:
      description: >-
        Genome lookup precedence is built-in, user, then repository. Requested
        genomes compose in order and local Seed values merge last. The winning
        address retains origin, ID, and path provenance.
      artifacts:
        - genome-catalog
    composition:
      description: >-
        Recursive composition detects cycles and excessive depth. Keyed objects
        merge recursively, ID arrays merge by ID, addressable tree/list forms
        normalize together, ordinary arrays replace, and scalars replace.
    selectors:
      description: >-
        String and object selectors include sections, addresses, subtrees, or
        artifacts with reference and artifact closure. Exclusions remove exact,
        subtree, ID, artifact, or glob matches after composition. Any unmatched
        selector fails.
    complete-exclusion:
      description: >-
        Standalone !genome exclusions are order-independent, remove the genome
        transitively throughout the composed graph, and fail when unmatched.
  blueprints-and-diffs:
    constructed-blueprint:
      description: >-
        Blueprint compiles local and genome content into fixed semantic section
        order with exact addresses, values, references, provenance, applied
        genomes, filters, requirements readiness, and external dependencies.
    machine-data:
      description: >-
        JSON blueprint output contains the complete constructed data model.
        Section, address or ID filters retain reference closure; offset and limit
        apply per section. Machine output remains complete for large piped data.
    cross-seed-dependencies:
      description: >-
        Named-Seed and genome-qualified reference syntax resolves against another
        present compiled Seed, rejects self or missing targets, and enforces
        requested genome provenance. Referenced Seeds retain separate authority.
    drift:
      description: >-
        Seed diff compares compiled YAML and Blueprint diff compares constructed
        semantics against the selected snapshot. Canonical dependency drift is
        reported separately and does not create or expire selected-Seed work.
  verification:
    work-queue:
      description: >-
        Explicit verification items precede implicit items for addressable
        obligation sections. Claims have owners and leases; stale claims become
        reclaimable, ownership gates transitions, and terminal states are
        confirmed or failed.
    executable-evidence:
      description: >-
        Confirm requires every command to pass; fail requires at least one to
        fail. Evidence uses existing unique repository-relative files, SHA-256
        hashes, Seed-address fingerprints, bounded command diagnostics, and the
        selected repository as command working directory.
    expiry-and-reconciliation:
      description: >-
        Missing or changed evidence, absent test commands, or changed referenced
        Seed addresses expire terminal evidence. New compiled items enter pending
        work and removed items leave the reconciled queue.
    replay-and-refresh:
      description: >-
        check executes each unique stored command once and fans results to all
        uses. refresh-expired is an atomic fast path only for confirmed,
        evidence-file-only expiry with no contract change or other pending work.
    evidence-production:
      description: >-
        One repository-owned producer executes shared or expensive proofs once
        for a stable content-derived product revision and publishes a complete
        manifest with declared inputs, outputs, command results, and bounded but
        undiscarded diagnostic locations. Per-address verification commands are
        read-only consumers of that manifest and do not execute producer work.
    completion-and-sync:
      description: >-
        completed requires every item terminal; satisfied also requires no failed
        or expired items. sync requires satisfaction and publishes the current
        Seed snapshot, dependency snapshot, and reconciled session as one
        crash-consistent selected-Seed transaction while preserving only
        still-valid terminal results.
  distribution:
    package-surface:
      description: >-
        npm-compatible packing includes the executable production source,
        packaged genomes, portable skill, README, package metadata, and license;
        tests and the lockfile are repository inputs rather than shipped files.
      artifacts:
        - package-manifest
        - dependency-lock
        - genome-catalog
        - portable-skill
    portable-skill-installation:
      description: >-
        Installation stages a recursive copy, omits Codex-specific agent metadata
        for Claude, atomically replaces one seed-lang target, restores the prior
        target on replacement failure, and removes successful backups.
      artifacts:
        - portable-skill
  command-protocol:
    help-and-dispatch:
      description: >-
        --help or -h prints global usage and succeeds from any argument position.
        --version is not an implemented command. Unknown commands, subcommands,
        options, unsafe names, and malformed values fail nonzero.
    streams-and-results:
      description: >-
        Normal human and machine result data is written to stdout. Parser and
        caught operational exceptions use concise Error-prefixed stderr text;
        validation and verification result diagnostics may remain on stdout.
    accessible-plain-output:
      description: >-
        Human-readable output remains usable without ANSI decoration. Non-TTY
        output is plain by default; NO_COLOR, TERM=dumb, and supported
        --no-color paths suppress ANSI without removing semantic content.

errors:
  contract-input:
    description: >-
      Missing contracts, malformed YAML, unsupported tags, invalid section
      shapes or IDs, unresolved requirements, bad artifact declarations,
      unresolved references, and invalid policies fail with contextual diagnostics.
  repository-paths:
    description: >-
      Missing or non-directory --repo targets, missing or duplicate --seed,
      unsafe or reserved names, overwrite attempts, and missing snapshots fail
      without silently selecting another location.
  genomes:
    description: >-
      Operations that load, compile, blueprint, or validate genomes fail for
      unknown or malformed definitions, malformed or unmatched selectors and
      exclusions, broken references, cycles, and recursion overflow with relevant
      genome or source context. Genome listing may retain a malformed entry with
      an empty description instead of failing while reading presentation metadata.
  cross-seed-references:
    description: >-
      Missing source Seeds or addresses, self-reference, and genome provenance
      mismatch fail without taking verification ownership of the source Seed.
  verification:
    description: >-
      Corrupt state, invalid transitions, wrong owners, missing or unsafe evidence,
      failed proof commands, evidence-address binding failures, invalid producer
      manifests, incomplete audits, expiry, orphaned or contended locks, partial
      transactions, and unsatisfied sync fail visibly while retaining complete
      diagnostic artifacts and bounded inline diagnostics where applicable.
  skill-installation:
    description: >-
      Missing or conflicting platform choice, unsupported targets, missing bundled
      skill content, and filesystem replacement failures fail and preserve or
      restore the prior installation when replacement began.

state:
  selected-seed:
    description: >-
      Authored master or named Seed files remain separate from generated .seed
      snapshots, dependency snapshots, session ledgers, and lock directories.
    persistence: filesystem
    consistency: selected-seed-isolation
    semantics: authored-contract-and-generated-verification-state
  genome-sources:
    description: >-
      Packaged, user, and repository genome sources remain distinct and are
      re-read for each compilation according to precedence.
    persistence: filesystem
    semantics: ordered-source-overrides
  verification-session:
    description: >-
      Session ledgers store claims, attempts, evidence hashes, command results,
      address fingerprints, and aggregate state. Per-session locks serialize
      ledger-only updates; one selected-Seed transaction lock serializes every
      operation that publishes shared snapshots or dependency state. Snapshot,
      dependency, and reconciled ledger files become visible together or the
      prior complete generation remains authoritative.
    persistence: filesystem
    consistency: selected-seed-transaction-and-session-locks
    semantics: incremental-verification-ledger
  verification-evidence-products:
    description: >-
      Shared evidence products are keyed by a digest of declared repository
      inputs rather than mutable branch names or file existence. Successful
      manifests and referenced durable diagnostics are reproducible; locks,
      staging paths, incomplete generations, and unreferenced caches are
      transient.
    persistence: filesystem
    consistency: locked-atomic-generation-publication
    semantics: one-producer-many-read-only-consumers
  skill-targets:
    description: >-
      Explicit install-skill operations persist outside the repository under
      CODEX_HOME or CLAUDE_HOME, falling back to platform-specific directories
      under HOME.
    persistence: filesystem
    semantics: explicit-user-skill-installation

security:
  repository-boundaries:
    description: >-
      Selected contract, verification state, repository genomes, and evidence
      paths resolve from the chosen repository. Deliberate exceptions are user
      genomes and explicit Codex or Claude skill installation destinations.
    policy: global
  validated-identifiers-and-evidence:
    description: >-
      Seed/session names and evidence paths are normalized and checked; evidence
      rejects empty, absolute, root, traversal, duplicate, and missing paths.
    policy: global
  evidence-realpath-containment:
    description: >-
      Every evidence file and every traversed parent resolves through filesystem
      links to a real path inside the selected repository. Missing paths,
      symlink escapes, and paths that change identity during validation fail
      before hashes or terminal evidence are recorded.
    policy: global
  trusted-proof-command-interface:
    description: >-
      Verification test commands are trusted operator-provided shell strings,
      executed unchanged from the selected repository with a timeout and bounded
      captured output. They are not an untrusted command-sandbox boundary.
    policy: global
  trusted-pager-interface:
    description: >-
      PAGER is trusted operator environment input and is shell-executed only when
      an operator explicitly requests paging.
    policy: global

environment:
  node-and-npm:
    description: >-
      The product runs as a CommonJS Node.js CLI with npm-managed dependencies.
      The package declares no Node.js engines range, so master does not invent a
      minimum runtime version.
    artifacts:
      - package-manifest
      - dependency-lock
  package-status:
    description: >-
      Version 0.0.0 is a private prototype. Local installation and packing are
      supported; registry publication is not an active product surface.
    artifacts:
      - package-manifest

observability:
  diagnostics:
    description: >-
      Command exit status is authoritative. Error text identifies the failed
      operation, while verification command records retain exit code, signal,
      timeout state, duration, and visibly truncated stdout and stderr.
  provenance:
    description: >-
      Constructed items expose exact addresses and winning Seed or genome source
      provenance; cross-Seed dependencies expose source path and provenance.
  verification-views:
    description: >-
      pending, status, audit, and report expose nonterminal work, expiry, failures,
      policy coverage, evidence files, commands, and aggregate completion.

compatibility:
  seed-language:
    description: >-
      Required section names, address normalization, reference syntax, policy
      defaults, artifact attachment, requirements gate, and verification item
      shape are contract-language compatibility surfaces.
  selected-paths:
    description: >-
      seed/seed.yml and .seed are master paths; seed/NAME and .seed/NAME are named
      paths. Safe-name rules and master reservation are stable path semantics.
  genome-catalog:
    description: >-
      The 204 built-in IDs present in @genome-catalog at distillation commit
      a07f0e6 are current compatibility surfaces. The retired
      verify-gli-golden-output alias is not supported.
    artifacts:
      - genome-catalog
  package-surface:
    description: >-
      The seed executable and files selected by @package-manifest remain
      npm-compatible. Observable changes require an intentional Seed change.
    artifacts:
      - package-manifest
  prototype-evolution:
    description: >-
      Human wording and internal details may evolve during the private prototype,
      but command semantics, machine data, paths, formats, and state meaning do
      not change accidentally.

constraints:
  explicit-license-choice:
    description: >-
      The repository owner selected the MIT terms recorded in @repo-license;
      implementation work must not infer or replace that license.
    artifacts:
      - repo-license
    policy: global
  license-metadata-consistency:
    description: >-
      The root package.json and root package entry in package-lock.json declare
      MIT, matching the authoritative MIT terms in @repo-license. README and
      source files are not license-declaration surfaces in the as-built product.
    artifacts:
      - repo-license
      - package-manifest
      - dependency-lock
    policy: global
  selected-seed-authority:
    description: >-
      Only this master Seed's explicit and implicit addresses plus global policies
      create verification ownership; referenced or future Seeds remain separate.
    policy: global
  deterministic-data:
    description: >-
      Canonical JSON recursively sorts object keys, preserves array order, and
      deterministic collections retain complete output including data larger
      than a typical pipe buffer.
  verification-state-integrity:
    description: >-
      Session state updates are lock-serialized, terminal evidence is hash-bound,
      selected-Seed snapshot publication is transactionally all-or-nothing,
      refresh is all-or-nothing, evidence-address binding errors are fatal, and
      failures never fabricate successful evidence.
    policy: global
  single-evidence-producer:
    description: >-
      Exactly one repository evidence producer owns shared or expensive proof
      execution and publication. Its revision key covers every declared product,
      test, dependency, configuration, and producer input; a lock with recoverable
      ownership guards each revision; publication atomically exposes a complete
      success manifest; failures retain diagnostics without publishing success.
      All verification-item consumers are read-only, and one producer failure is
      reported once with consumers referring to that result.
    policy: global
  seed-support-organization:
    description: >-
      Seed-owned executable support source resides under seed/scripts, native
      Node behavioral tests reside under test, and generated evidence resides in
      selected-Seed state. Durable generated files are reproducible and tracked
      only when referenced by the verification ledger; locks, staging files,
      caches, package outputs, and incomplete generations are ignored and cleaned.
    policy: global
  native-test-ownership:
    description: >-
      Behavioral assertions expressible with Node APIs, disposable fixtures, or
      the CLI process reside in the node:test suite under test. Seed scripts
      orchestrate evidence production or inspect its manifest; standalone shell
      or external harnesses are reserved for genuine packaging, process,
      filesystem, or operating-system boundaries.
    policy: global
  one-cli-package:
    description: >-
      The product remains one npm-compatible package with one seed executable;
      internal modules may remain focused implementation units.
  dependency-snapshot-ownership:
    description: >-
      Cross-Seed dependency snapshots report dependency drift but never promote
      source-Seed obligations into master implementation or verification work.
    policy: global
  private-prototype:
    description: >-
      Package and contract distribution are local/private; publication or public
      release obligations require a later Seed change.

freedom:
  internal-modules:
    description: >-
      Production may choose maintainable CommonJS module boundaries and algorithms
      while preserving the observable command, data, state, and error contracts.
  performance-strategy:
    description: >-
      Compilation, diffing, locking, hashing, and command replay strategies may
      change when deterministic results, bounded diagnostics, and state integrity
      remain intact.
  future-surfaces:
    description: >-
      New runtimes, publication, commands, formats, or stronger security policies
      require explicit contract changes rather than inference from this freedom.

verifications:
  evidence-producer-safety:
    title: Shared evidence production is revision-safe and reusable
    description: >-
      Verify @behavior.verification.evidence-production and
      @constraints.single-evidence-producer through cold, concurrent, interrupted,
      and warm executions against a disposable selected-Seed state root.
    method: >-
      Run the repository evidence producer from an empty cache, invoke the same
      revision concurrently, interrupt it at lock and publication fault points,
      then invoke it warm. Assert exactly one successful execution per expensive
      proof, one stable content-derived revision, recoverable lock ownership,
      atomic complete-manifest publication, retained failure diagnostics, and
      byte-identical read-only consumer results without producer-side writes.
    evidence_required:
      - Exact cold, concurrent, interrupted, warm, and consumer commands with exit statuses.
      - Revision input inventory, digest, execution counts, lock outcomes, and manifest hashes.
      - Complete producer diagnostics for every injected failure and proof that no success manifest or partial generation became authoritative.
    artifacts:
      - source-contract
      - test-contract
      - seed-evidence-scripts
  verification-state-transactions:
    title: Verification state publication is crash-consistent
    description: >-
      Verify @state.verification-session and
      @constraints.verification-state-integrity under concurrent sessions and
      injected failures at every snapshot, dependency, and ledger publication step.
    method: >-
      Use native disposable-repository tests to race two session IDs that target
      one selected Seed, interrupt each transaction publication step, and inject
      evidence-address fingerprinting failure during refresh. Every observation
      must expose one complete generation, preserve the prior generation after
      interruption, serialize shared-state writers, and fail without clearing or
      fabricating evidence bindings.
    evidence_required:
      - Exact native test command and exit status.
      - Concurrent-writer and per-publication-fault results for all three coupled files.
      - Before/after generation hashes and explicit evidence-binding failure diagnostics.
    artifacts:
      - source-contract
      - test-contract
  evidence-path-containment:
    title: Evidence paths cannot escape through filesystem links
    description: Verify @security.evidence-realpath-containment for files and parent directories.
    method: >-
      Use disposable native tests with an in-repository file, an evidence-file
      symlink to an external target, a parent-directory symlink to an external
      directory, a dangling link, and a link identity change between validation
      and hashing. Only the stable in-repository real path may reach terminal evidence.
    evidence_required:
      - Exact native test command and exit status.
      - Realpath containment results for every file and parent-link fixture.
      - Nonzero results and contextual diagnostics for every escape, dangling, or changed-identity case.
    artifacts:
      - source-contract
      - test-contract
  support-organization:
    title: Seed support and native tests have one clear home
    description: >-
      Verify @constraints.seed-support-organization and
      @constraints.native-test-ownership across tracked files and package output.
    method: >-
      Run a repository inventory assertion that classifies every file below test,
      seed/scripts, seed/evidence, and selected .seed state; rejects behavioral
      tests outside test, executable support outside seed/scripts, unreferenced
      durable evidence, and tracked locks, caches, staging, incomplete, or package
      outputs; then inspect npm pack dry-run output for Seed-only support exclusion.
    evidence_required:
      - Exact inventory and package-inspection commands with exit statuses.
      - Complete classified support-file inventory and ledger references for durable generated evidence.
      - Ignore-rule proof for transient locks, caches, staging paths, incomplete generations, and package outputs.
    artifacts:
      - package-manifest
      - test-contract
      - seed-evidence-scripts
  repo-license:
    title: Repository license is explicit and consistent
    description: >-
      Verify the authoritative license text and every repository artifact that
      actually declares the root package license agree on MIT without treating
      dependency licenses or README prose as project license declarations.
    method: >-
      After @verifications.evidence-producer-safety has published the revision
      manifest, run the repo-license read-only evidence consumer. It checks the
      native license-test result and parsed package, lockfile, and LICENSE facts
      without executing the producer or mutating its output.
    evidence_required:
      - Producer revision and exact read-only consumer command with exit status.
      - Parsed root package and lockfile license identifiers.
      - LICENSE identification and mismatch diagnostics.
    artifacts:
      - repo-license
      - package-manifest
      - dependency-lock
      - seed-evidence-scripts
  unit-tests:
    title: Unit tests pass
    description: Verify isolated Seed-critical behavior through the repository test suite.
    method: >-
      After @verifications.evidence-producer-safety, run the unit-tests read-only
      evidence consumer against the shared native-test result.
    evidence_required:
      - Producer revision and exact read-only consumer command with exit status.
      - Complete passing summary or failing diagnostics from all test files.
      - Confirmation that fixture repositories and homes were disposable and cleaned.
    artifacts:
      - test-contract
  integration-tests:
    title: Integration tests pass
    description: Verify integrated CLI and filesystem workflows through the repository test suite.
    method: >-
      After @verifications.evidence-producer-safety, run the integration-tests
      read-only evidence consumer against the shared native-test result.
